plugin:
  enabled: "<#7CFC8A>ImageDisplay enabled. Locale: <white><locale></white>"

commands:
  no-permission: "<red>You do not have permission.</red>"
  usage: "<yellow>Usage: /<label> <white>reload</white> | <white>generate <picture-file> [texture-id] [--apikey <slot>]</white> | <white>cancel [texture-id]</white></yellow>"
  reload:
    success: "<#7CFC8A>Image Display reloaded.</#7CFC8A>"
  cancel:
    usage: "<yellow>Usage: /<label> cancel [texture-id|all]</yellow>"
    success: "<#7CFC8A>Generation <white><id></white> was successfully cancelled.</#7CFC8A>"
    success-all: "<#7CFC8A>All active generations were cancelled.</#7CFC8A>"
    no-active: "<gray>There are no active generations currently running.</gray>"
    not-found: "<red>Active generation with ID <white><id></white> not found.</red>"
    multiple-active: "<yellow>Multiple generations are active: <white><ids></white>. Specify an ID: /<label> cancel <id> (or /<label> cancel all)</yellow>"
  generate:
    usage: "<yellow>Usage: /<label> generate <picture-file> [texture-id] [--apikey <slot>]</yellow>"
    started: "<gray>Generating texture from <white><picture></white> <dark_gray>(key #<key>)</dark_gray>...</gray>"
    success: "<#7CFC8A>Generated texture id: <white><id></white> | Placeholder: <click:copy_to_clipboard:'<placeholder>'><hover:show_text:'<gray>Click to copy placeholder</gray>'><white><placeholder></white></hover></click> <click:copy_to_clipboard:'<placeholder>'><hover:show_text:'<gray>Click to copy to clipboard</gray>'><bold><#5555FF>[Copy]</#5555FF></bold></hover></click></#7CFC8A>"
    failed: "<red>Generation failed: <white><reason></white></red>"
    cancelled: "<yellow>Generation of <white><picture></white> was cancelled.</yellow>"
    invalid-apikey: "<red>Invalid API key slot number: <white><key></white></red>"
    apikey-not-found: "<red>API key #<slot> is not configured or empty. Available slots: <white><available></white></red>"
    no-apikeys: "<red>No MineSkin API keys configured in config.</red>"
    bossbar:
      title: "<gradient:#7B61FF:#28D7FF>ImageDisplay</gradient> <dark_gray>•</dark_gray> <white><picture></white> <gray>(#<key>, <current>/<total>)</gray> <#79F2A9><percent>%</#79F2A9> <dark_gray>•</dark_gray> <gray><status></gray>"
      status-preparing: "Preparing..."
      status-queued: "Waiting in MineSkin queue..."
      status-active: "Mojang processing..."
      status-completed: "Done!"
    console-progress: "Generating <white><picture></white> (key #<key>): tile <current>/<total> (<percent>%) <dark_gray>•</dark_gray> <status>"
    console-cancelled: "Generation of <white><picture></white> cancelled."

log:
  console:
    prefix: "<gradient:#7B61FF:#28D7FF>[ImageDisplay]</gradient>"
    level-info: "<#79F2A9>INFO</#79F2A9>"
    level-warn: "<#FFB27D>WARN</#FFB27D>"
  bridge:
    packet-error: "Packet bridge error: <reason>"
  service:
    mineskin-limit: "MineSkin limit (<code>), retry <attempt>/<max_attempts> after <delay_ms>ms"
    mineskin-rate-limit: "Waiting for MineSkin queue slot (429), retry <attempt>/<max_attempts> after <delay_ms>ms"
    mineskin-gateway-delay: "MineSkin gateway delay (<code>), retry <attempt>/<max_attempts> after <delay_ms>ms"
  tab:
    bridge-enable-failed: "Failed to enable TAB placeholder bridge"
    refresh-failed: "Failed to refresh TAB image placeholders"
    force-refresh-failed: "Failed to force TAB visual refresh"
    load-listener-register-failed: "Could not register TAB load listener"
    minimessage-enabled-warning: "TAB config has components.minimessage-support=true. For image rendering in tabprefix/tagprefix set it to false and run /tab reload."
